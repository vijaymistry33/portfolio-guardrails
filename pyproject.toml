[project]
name = "portfolio-guardrails"
version = "1.0.0"
description = "Daily monitoring, rebalancing and ETF due diligence for a multi-asset, multi-currency model portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
portfolio-guardrails = "portfolio_guardrails.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["portfolio_guardrails"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["portfolio_guardrails", "conftest"]
